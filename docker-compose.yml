# docker compose up -d --build
# Then open http://<pi-address>:8080 and create the admin account.
# The setup code is in the log:  docker compose logs r_flix
services:
  r_flix:
    build: .
    image: r_flix:latest
    container_name: r_flix
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Users, Jellyfin servers and settings (SQLite) + the key that encrypts stored credentials.
      # BACK THIS UP. (Or set RFLIX_SECRET below to keep the key out of the volume.)
      - rflix-data:/data
    environment:
      # RFLIX_SECRET: "a-long-random-string"   # optional: encrypt stored credentials with this instead of /data/secret.key
      # RFLIX_TRUST_PROXY: "1"                 # set when running behind a reverse proxy (HTTPS)
      # RFLIX_SETUP_CODE: "choose-a-code"      # optional: fixed first-run code instead of a random one in the log
      TZ: UTC
    # Pi 3B+ has 1 GB RAM: keep the container small (r_flix idles well under 100 MB).
    mem_limit: 256m
    # Fewer writes = longer SD card life.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  rflix-data:
